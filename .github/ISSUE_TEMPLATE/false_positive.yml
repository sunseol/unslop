name: False positive
description: Report a finding that should not have been flagged.
title: "[false-positive] "
labels:
  - false-positive
  - rules
body:
  - type: input
    id: rule_id
    attributes:
      label: Rule ID
      placeholder: copy.generic_cta
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why is this finding acceptable for the product or brand?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Minimal evidence
      description: Paste the smallest safe snippet or finding JSON needed to understand the issue.
      render: text
    validations:
      required: true
  - type: textarea
    id: suppression
    attributes:
      label: Preferred suppression
      description: Should this be handled by config ignore, inline ignore, or a rule change?
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: I removed secrets, private URLs, proprietary screenshots, and personal data from this issue.
          required: true
