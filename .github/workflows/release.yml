name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish @unslop/cli to npm
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: validate release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build, test, and typecheck
        run: npm run check

      - name: Verify package contents
        run: npm run pack:dry-run

  publish:
    name: publish npm package
    needs: validate
    if: ${{ inputs.publish == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-production

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Publish @unslop/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --workspace @unslop/cli --access public --provenance
